<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d9c4ab"><title>CLHTML · Chronicles gates</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d9c4ab;color:#35291f;font:16px/1.5 "Instrument Sans",Arial,sans-serif}
main{width:min(880px,calc(100% - 32px));margin:0 auto;padding:20px 0 38px}
nav,footer{display:flex;justify-content:space-between;align-items:center;font-size:.84rem}nav{border-bottom:1px solid #af9579;padding-bottom:12px}nav strong{font:700 1.45rem Georgia,serif;letter-spacing:.05em}a{color:inherit;text-underline-offset:4px}
header{text-align:center;padding:22px 0 18px}h1,h2,p{margin:0}h1{font:normal clamp(2.15rem,5vw,3.35rem)/1.12 Georgia,serif}header p{font-size:.94rem;margin-top:6px;color:#594736}
.frame{border-radius:14px;overflow:hidden;border:1px solid #ab9277;background:#efdfc9}.frame img{display:block;width:100%;height:clamp(220px,42vw,405px);object-fit:cover;object-position:50% 54%}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#bca386}.gate{display:flex;align-items:center;justify-content:space-between;text-decoration:none;padding:13px clamp(12px,3vw,26px);background:#f3e5d1;line-height:1.3}.gate b{font:600 clamp(1.15rem,3vw,1.55rem) Georgia,serif}.gate small{display:block;font-size:.8rem;margin-top:3px}.gpt{color:#294239}.claude{background:#e8d2b7;color:#59391e}.gate i{font-size:1.15rem;font-style:normal}.gate:hover{filter:brightness(1.035)}
details{background:#f5eadd;border:1px solid #b49b80;border-radius:10px;padding:14px 17px;margin:14px 0}summary{cursor:pointer;font:600 1.12rem Georgia,serif}details p{font-size:.91rem;margin:11px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions a,button{border:1px solid #a1876d;padding:9px 13px;border-radius:8px;color:inherit;background:#eadbc8;font:600 .83rem/1.4 Arial,sans-serif;text-decoration:none;cursor:pointer}.actions a:first-child{background:#533b29;color:white}.actions [hidden],#status:empty{display:none}footer{color:#574637;margin-top:15px}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #74502b;outline-offset:-3px}@media(max-width:420px){main{width:calc(100% - 20px);padding-top:12px}header{padding:16px 0}.gate{padding:12px}}
</style></head>
<body><main>
<nav aria-label="Site navigation"><strong>CLHTML</strong><a href="https://benji-chronicles.vercel.app/">Open Chronicles ↗</a></nav>
<header><h1>Chronicles gates</h1><p>Choose your writing workshop.</p></header>
<div class="frame"><img src="/assets/library.webp" width="1440" height="960" alt="A stone bridge leads to green and walnut doors opening into the same library.">
<div class="gates"><a class="gate gpt" href="https://aghtml.vercel.app/"><span><b>AGHTML</b><small>From GPT</small></span><i aria-hidden="true">↗</i></a><a class="gate claude" href="#claude"><span><b>CLHTML</b><small>From Claude</small></span><i aria-hidden="true">↓</i></a></div></div>
<details id="claude" open><summary>Message to Claude</summary><p>Share this brief in your Claude conversation. Bring back the reply and the original book files for review.</p>
<div class="actions"><a href="/claude.txt">Read brief</a><button id="copy" type="button" hidden>Copy prompt</button><a href="/handoff.txt" download="CLHTML_Claude_Handoff_001.txt">Download brief</a></div><p id="status" role="status"></p></details>
<footer><span>CLHTML 001 · 25 Nov 2026</span><a href="https://github.com/drbenji793-dot/clhtml">GitHub ↗</a></footer>
</main><script>
const panel=document.getElementById('claude');
document.querySelector('.claude').addEventListener('click',()=>{panel.open=true;panel.querySelector('summary').focus();});
const copy=document.getElementById('copy');
if(navigator.clipboard)copy.hidden=false;
copy.onclick=async()=>{try{await navigator.clipboard.writeText('Claude, open https://clhtml.vercel.app/claude.txt and follow the handoff. Return your inventory, one chapter example, your actual access, and the read receipt.');document.getElementById('status').textContent='Copied. Paste the prompt into Claude.';}catch{document.getElementById('status').textContent='Open Read brief to copy the text, or attach the downloaded brief.';}};
</script></body></html>
