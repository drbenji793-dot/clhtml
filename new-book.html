<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clhtml002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style id="app-css">
:root {
  /* layout: one shared frame (1440 max). Papyrus by day, night caravan after dark. Three story colours: dream gold, fall coral, road teal. */
  --bg: #dccab0; --panel: #e9d9bf; --card: #f5ead7; --ink: #22362d; --muted: #675f4f; --line: #b8a385;
  --accent: #2f5a45; --on-accent: #f7eedd;
  --dream: #8a5d0a; --fall: #a2463d; --road: #1f6573;
  --ok: #2c6e43; --warn: #a2463d; --info: #2c6388;
  --w0: #2a6f9c; --w1: #a8323f; --w2: #3a7a3f; --w3: #7a4a96;
  --display: "Amiri", "Geeza Pro", "Traditional Arabic", Georgia, serif;
  --body: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", system-ui, Tahoma, sans-serif;
  --gut: 12px; --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171a; --panel: #172024; --card: #1e282d; --ink: #e8ecea; --muted: #9aa8aa; --line: #35434a;
    --accent: #e0b146; --on-accent: #1a1d16;
    --dream: #e0b146; --fall: #e58279; --road: #62bfce;
    --ok: #74c48d; --warn: #e58279; --info: #77b5df;
    --w0: #77b5df; --w1: #ee8f98; --w2: #86cf8b; --w3: #c49be0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171a; --panel: #172024; --card: #1e282d; --ink: #e8ecea; --muted: #9aa8aa; --line: #35434a;
  --accent: #e0b146; --on-accent: #1a1d16;
  --dream: #e0b146; --fall: #e58279; --road: #62bfce;
  --ok: #74c48d; --warn: #e58279; --info: #77b5df;
  --w0: #77b5df; --w1: #ee8f98; --w2: #86cf8b; --w3: #c49be0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; max-width: 100%; overflow-x: clip; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--info); }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
#shell { min-height: 100%; display: flex; flex-direction: column; }
.frame { width: calc(100% - 2 * var(--gut)); max-width: 1440px; margin-inline: auto; min-width: 0; }
@media (min-width: 900px) { :root { --gut: 32px; } }
#app { display: flex; flex-direction: column; gap: 14px; padding-block: 14px 28px; flex: 1; }
#app > * { min-width: 0; }
p, span, li, h1, h2, h3, h4, dd, bdi { overflow-wrap: anywhere; }

/* ---- top */
#top { background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 8px 4px; }
.brand { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 2px; min-width: 0; }
.sun { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--dream); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dream) 22%, transparent); flex: none; }
.brand-n { font: 700 22px/1.2 var(--display); }
.top-r { display: flex; align-items: center; gap: 6px; min-width: 0; }
.chipbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-weight: 500; font-size: 13px; max-width: 46vw; }
.chipbtn bdi { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.here-in { display: inline-flex; gap: 2px; padding-inline: 4px; }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding-block: 4px 0; }
.tab { min-height: 44px; border: 0; border-bottom: 3px solid transparent; background: none; font-weight: 600; font-size: 14px; color: var(--muted); padding: 4px 2px; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (min-width: 900px) { .tabs { grid-template-columns: repeat(5, max-content); gap: 22px; } .tab { padding-inline: 6px; } }

/* ---- type */
.h1 { font: 700 clamp(34px, 6vw, 56px)/1.25 var(--display); margin: 0; text-wrap: balance; }
.h1.sm { font-size: clamp(26px, 4.4vw, 38px); }
.h2 { font: 600 17px/1.35 var(--body); margin: 0 0 8px; text-wrap: balance; }
.h2[lang="ar"] { font: 700 22px/1.4 var(--display); }
.label { display: block; margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sub { margin: 0; font-size: 13px; color: var(--muted); }
.ar { font-size: 16px; line-height: 1.85; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
.grp { margin: 10px 0 0; font: 600 13px/1.4 var(--body); letter-spacing: .04em; color: var(--muted); }

/* ---- surfaces */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.notice { margin: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.notice.warn { border-color: var(--warn); } .notice.info { border-color: var(--info); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; min-width: 0; }
.row.end { justify-content: flex-end; } .row.between { justify-content: space-between; margin-top: 0; }
.row.grow > .field, .row.grow > .ta { flex: 1 1 180px; min-width: 0; }
.grow { flex: 1; }
.two { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.docs { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .two, .docs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---- controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-weight: 600; font-size: 14px; text-align: center; }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: none; }
.btn.link { background: none; border: 0; padding: 4px 2px; min-height: 32px; color: var(--info); font-weight: 500; }
.btn.danger { color: var(--warn); }
.btn.pick { border-radius: 999px; }
.btn.x { min-height: 30px; min-width: 30px; padding: 0; border-radius: 50%; background: none; }
.btn[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
.field, .ta { width: 100%; min-height: 42px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 16px; line-height: 1.7; }
.ta { display: block; resize: vertical; }
.ta.mono { font-size: 12px; line-height: 1.5; }
select.field { appearance: auto; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; font-size: 13px; }
.check input, .opt input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { min-height: 38px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 13px; font-weight: 500; }
.pill b { font-variant-numeric: tabular-nums; margin-inline-start: 2px; }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.bar { display: flex; flex-direction: column; gap: 0; }
.badge { display: inline-flex; align-items: center; padding: 1px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 1.7; white-space: nowrap; color: var(--muted); }
.badge.ok { color: var(--ok); border-color: var(--ok); } .badge.warn { color: var(--warn); border-color: var(--warn); } .badge.info { color: var(--info); border-color: var(--info); }
.wd { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700; line-height: 1; color: var(--bg); background: var(--c); flex: none; }
.w0 { --c: var(--w0); } .w1 { --c: var(--w1); } .w2 { --c: var(--w2); } .w3 { --c: var(--w3); }
.mode { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.mode.ok { color: var(--ok); } .mode.warn { color: var(--warn); } .mode.info { color: var(--info); }

/* ---- home */
.hero { position: relative; overflow: hidden; display: flex; justify-content: space-between; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px 18px; }
.hero-t { min-width: 0; position: relative; z-index: 1; }
.hero-s { margin: 6px 0 0; font: 400 18px/1.8 var(--display); max-width: 34em; }
.hero-m { margin: 12px 0 0; }
.aten { width: clamp(120px, 26vw, 250px); flex: none; align-self: flex-start; stroke: var(--dream); fill: none; stroke-width: 1.6; stroke-linecap: round; opacity: .85; margin-block: -6px -30px; }
.aten circle { fill: color-mix(in srgb, var(--dream) 20%, transparent); stroke-width: 2.2; }
@media (max-width: 520px) { .aten { position: absolute; left: -30px; top: -8px; opacity: .26; width: 190px; } }
/* every emblem but the sun sits whole above the title on a phone */
@media (max-width: 520px) { .hero.hero-stack { flex-direction: column; gap: 0; } .hero.hero-stack .aten { position: static; order: -1; width: 118px; opacity: .95; stroke-width: 2.3; margin: -8px 0 4px; } }
.startbox > .aten { position: static; display: block; width: 118px; opacity: .95; stroke-width: 2.3; margin: -6px 0 6px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 900px) { .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; } }
.tile { display: flex; flex-direction: column; justify-content: space-between; gap: 4px; min-height: 86px; padding: 11px 12px; text-align: start; background: var(--card); border: 1px solid var(--line); border-inline-start: 4px solid var(--line); border-radius: var(--r); }
.tile.warn { border-inline-start-color: var(--warn); } .tile.ok { border-inline-start-color: var(--ok); } .tile.info { border-inline-start-color: var(--info); }
.tile-l { font-size: 12px; color: var(--muted); line-height: 1.35; }
.tile-n { font: 700 30px/1 var(--body); font-variant-numeric: tabular-nums; }
.feed, .steps, .lines, .qlinks, .hist, .srcs { margin: 0; padding: 0; list-style: none; }
.feed { display: grid; gap: 4px; }
.feed-i { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 7px 4px; background: none; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); text-align: start; }
.feed-t { flex: 1; min-width: 0; font-size: 13px; } .feed-t .ar { font-size: 15px; }
.feed-at { font-size: 11px; color: var(--muted); white-space: nowrap; }
.steps { counter-reset: s; display: grid; gap: 8px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.who .row { margin-top: 10px; }

/* ---- talk */
.qlist { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); align-items: start; margin-top: 6px; }
@media (min-width: 900px) { .qlist { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; } .q.open { grid-column: 1 / -1; } }
.q { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.q.open { border-color: var(--accent); }
.q-h { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 4px 10px; width: 100%; min-height: 48px; padding: 10px 12px; background: none; border: 0; text-align: start; }
.q-id { font: 600 11px/1.9 ui-monospace, monospace; color: var(--muted); direction: ltr; }
.q-t { font: 700 18px/1.6 var(--display); }
.q-m { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 5px; }
.q-b { padding: 4px 12px 14px; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); max-width: 92ch; }
.q-ctx { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 8px 0 10px; }
.chg { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 6px; } .chg .label { margin: 0; }
.src { font-size: 11px; color: var(--muted); }
.opts { display: grid; gap: 6px; }
.opt { display: flex; align-items: flex-start; gap: 10px; min-height: 46px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
.opt input { margin-top: 6px; }
.opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.lean { border-style: dashed; border-color: var(--dream); }
.opt-t { flex: 1; min-width: 0; font-size: 16px; line-height: 1.8; }
.opt-w { display: inline-flex; align-items: center; gap: 3px; flex: none; margin-top: 3px; }
.leanmark { font-size: 10px; font-weight: 700; color: var(--dream); border: 1px dashed var(--dream); border-radius: 999px; padding: 0 7px; line-height: 1.8; }
.lean-row { margin: 8px 0 10px; }
.lean-why { margin: 6px 0 0; padding: 8px 11px; border-inline-start: 3px solid var(--dream); background: color-mix(in srgb, var(--dream) 9%, var(--card)); border-radius: 6px; font-size: 15px; line-height: 1.85; }
.says, .notes { display: grid; gap: 6px; margin-top: 8px; }
.say { display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px; background: var(--panel); border-radius: 8px; }
.say p { margin: 0; flex: 1; min-width: 0; white-space: pre-wrap; font-size: 15px; line-height: 1.75; }
.decided { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--ok); border-radius: 10px; background: color-mix(in srgb, var(--ok) 8%, var(--card)); }
.dec-t { margin: 0 0 4px; white-space: pre-wrap; font-size: 16px; line-height: 1.8; }
.form .label { margin-top: 10px; }

/* ---- story */
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 10px 0 0; }
.lg { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
.chip { display: inline-block; flex: none; padding: 0 8px; border: 1px solid var(--ink); border-radius: 999px; font-size: 10px; font-weight: 700; line-height: 1.8; white-space: nowrap; }
.chip.k-d { border-style: dotted; border-color: var(--warn); color: var(--warn); }
.chip.k-k { border-style: dashed; border-color: var(--muted); color: var(--muted); }
.chip.k-p { border-color: var(--dream); background: var(--dream); color: var(--bg); }
.lines { display: grid; gap: 6px; max-width: 96ch; }
.ln { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 4px 9px; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; }
.ln .chip { margin-top: 5px; }
.ln.k-q { grid-template-columns: minmax(0, 1fr); border-inline-start: 3px solid var(--road); font-weight: 500; }
.ln.k-p { border-color: color-mix(in srgb, var(--dream) 55%, var(--line)); }
.ln.off .tx { opacity: .5; text-decoration: line-through; }
.vote { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 5px; }
.vb { min-width: 56px; min-height: 36px; padding: 2px 12px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 13px; font-weight: 600; }
.vb.yes[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.vb.no[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--bg); }
.people { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .people { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; } .people .node.open { grid-column: 1 / -1; } }
.stretch { --c: var(--dream); border-inline-start: 4px solid var(--c); padding-inline-start: 12px; display: grid; gap: 8px; min-width: 0; }
.stretch.fall { --c: var(--fall); } .stretch.road { --c: var(--road); }
.stretch-l { margin: 0; font: 700 22px/1.4 var(--display); color: var(--c); }
.stretch-l span:first-child { font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; margin-inline-end: 6px; }
.flow, .chs { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .flow, .chs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; } .flow > .node.open, .flow > .fork, .flow > .ten-w { grid-column: 1 / -1; } }
.fork { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 620px) { .fork { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fork .node.open { grid-column: 1 / -1; } }
.node { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.node.open { border-color: var(--c, var(--accent)); }
.node.side { border-style: dashed; }
.node-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 2px 9px; width: 100%; min-height: 48px; padding: 10px 12px; background: none; border: 0; text-align: start; }
.nnum { display: grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 999px; background: var(--c, var(--accent)); color: var(--bg); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.node-t { font: 700 19px/1.5 var(--display); grid-column: 2; }
.node-h > .n { grid-column: 3; grid-row: 1; }
.node-s, .node-h .tag { grid-column: 1 / -1; font-size: 14px; line-height: 1.75; color: var(--muted); }
.node-h .tag { font-size: 11px; }
b.n, b.m { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
b.n { background: var(--dream); color: var(--bg); } b.m { border: 1px solid var(--line); color: var(--muted); }
.ten-w { display: grid; gap: 6px; }
.ten { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 620px) { .ten { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ten .node.open { grid-column: 1 / -1; } }
.node.cmd .node-t { font-size: 17px; color: var(--c); }
.cpanel { padding: 4px 12px 14px; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.ctabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.ctab { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 3px 12px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 13px; font-weight: 500; }
.ctab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.sec-h { margin: 14px 0 6px; font: 700 18px/1.4 var(--display); }
.sec-h:not([lang]) { font: 600 12px/1.4 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.doc .sub { margin-bottom: 4px; font-size: 15px; }
.qlinks { display: grid; gap: 5px; }
.qlink { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; min-height: 42px; padding: 6px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; text-align: start; }
.srcs { display: grid; gap: 5px; font-size: 13px; }

/* ---- book */
.bookhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; }
.stat2 { display: flex; gap: 16px; font-size: 13px; color: var(--muted); } .stat2 b { font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.chrow { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 2px 8px; width: 100%; min-height: 48px; padding: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); text-align: start; }
.ch-n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--c); color: var(--c); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ch-t { font: 700 18px/1.5 var(--display); }
.ch-m { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12px; color: var(--muted); }
