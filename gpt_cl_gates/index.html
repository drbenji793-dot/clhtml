<script>(() => {
  const services = ['github', 'vercel', 'supabase'];
  const labels = {connected:'verified',failed:'connection failed',unknown:'unverified'};
  const colors = {connected:'#397448',failed:'#b24039',unknown:'transparent'};
  async function check(row) {
    function paint(states) {
      for (const name of services) {
        const label = row.querySelector('[data-service="'+name+'"]');
        const state = Object.hasOwn(labels,states[name]) ? states[name] : 'unknown';
        label.firstElementChild.style.backgroundColor = colors[state];
        label.title = label.textContent.trim() + ' · ' + labels[state];
        label.setAttribute('aria-label', label.title);
      }
    }
    paint({});
    try {
      const url = new URL('/api/uni005', location.protocol === 'file:' ? row.dataset.origin : location.origin);
      const response = await fetch(url, {cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(8000)});
      if (response.ok) paint(await response.json());
    } catch { /* A saved copy can be opened offline. */ }
  }
  document.addEventListener('toggle', e => {
    if (e.target.tagName === 'DETAILS' && e.target.open) {
      const row = e.target.querySelector('[data-connections]');
      if (row && row.closest('details') === e.target) check(row);
    }
  }, true);
})();
